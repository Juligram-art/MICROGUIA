<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#114b60"><title>MICROGUÍA</title><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon.svg"><style>
*{box-sizing:border-box}body{margin:0;background:#edf4f7;color:#183b4a;font:16px -apple-system,BlinkMacSystemFont,Segoe UI, sans-serif}header{background:#114b60;color:white;padding:22px 20px 19px}header .brand{display:flex;align-items:center;gap:14px;max-width:820px;margin:auto}.brand svg{width:43px;height:43px}h1{font-size:27px;letter-spacing:2px;margin:0}header p{margin:4px 0 0;color:#d4e9ed;font-size:13px}main{max-width:820px;margin:auto;padding:20px 16px 100px}h2{font-size:24px;margin:12px 0}h3{font-size:17px;margin:16px 0 8px}p{line-height:1.55}.notice{background:#fff5dc;border:1px solid #e7d4a6;color:#6b5221;padding:12px;border-radius:12px;font-size:13px;line-height:1.5}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.tile,.item{font:inherit;text-align:left;border:1px solid #d4e3e8;background:white;color:inherit;border-radius:15px;cursor:pointer;box-shadow:0 2px 5px #123c5010}.tile{min-height:120px;padding:16px;display:flex;flex-direction:column;align-items:flex-start;gap:10px}.tile strong{font-size:15px}.ico{width:42px;height:42px;background:#e0f1f0;color:#117e83;border-radius:12px;display:grid;place-items:center;flex-shrink:0}.ico svg{width:24px;height:24px}.muted{font-size:12px;color:#627b87}.item{display:flex;align-items:center;gap:13px;width:100%;padding:14px;margin:10px 0}.item span:nth-child(2){flex:1}.item strong{display:block}.item small{display:block;color:#607985;margin-top:4px;line-height:1.4}.danger .ico{background:#fde8e7;color:#ad2c2c}.danger strong{color:#ad2c2c}button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid #16858b;outline-offset:3px}input{width:100%;font:inherit;border:1px solid #ccdce3;border-radius:12px;padding:14px;background:#fff;color:#183b4a;margin:16px 0 4px}.back{border:0;background:none;color:#126c77;font:inherit;padding:8px 0;cursor:pointer}nav{position:fixed;bottom:0;left:0;right:0;background:white;border-top:1px solid #d4e3e8;display:flex;justify-content:center;padding:8px 0 max(8px,env(safe-area-inset-bottom));z-index:3}nav button{background:none;border:0;color:#126c77;min-width:100px;font:inherit;font-size:12px;cursor:pointer;display:grid;justify-items:center;gap:4px}nav svg{width:23px;height:23px}.poster{display:block;width:100%;border-radius:8px;border:1px solid #d4e3e8}.action{display:inline-block;color:white;background:#126c77;padding:12px 16px;border-radius:10px;text-decoration:none;font-weight:600;margin:12px 0}video{width:100%;background:#102f3b;border-radius:12px}.panel{background:white;border:1px solid #d4e3e8;border-radius:14px;padding:16px;margin:14px 0}.tag{font-size:11px;font-weight:600;color:#126c77;background:#e0f1f0;padding:4px 8px;border-radius:6px}.footer{text-align:center;font-size:12px;color:#607985;margin-top:24px}@media(min-width:660px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}.tile{min-height:130px}}@media(prefers-reduced-motion:no-preference){button:hover{border-color:#16858b}}
</style></head><body><header><div class="brand"><svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M18 5h8v20h-8zM22 25v7M15 12h-5v13a15 15 0 0 0 30 0v-5H29M11 40h30M24 40v-5M15 29h15"/></svg><div><h1>MICROGUÍA</h1><p>Manual de toma de muestras microbiológicas</p></div></div></header><main id="app"></main><nav aria-label="Navegación"><button onclick="go('home')" id="navhome"></button><button onclick="go('samples')" id="navsamples"></button><button onclick="go('contacts')" id="navcontacts"></button></nav><script>
const paths={drop:'M12 2C9 7 5 11 5 15a7 7 0 0 0 14 0c0-4-4-8-7-13Z',wind:'M3 8h12a3 3 0 1 0-3-3M3 12h17a3 3 0 1 1-3 3M3 16h9',flask:'M9 3h6M10 3v8l-6 9h16l-6-9V3M7 16h10',brain:'M12 5c-3-5-9 0-7 4-4 3-2 8 1 9 0 4 6 4 6 0V5Zm0 0c3-5 9 0 7 4 4 3 2 8-1 9 0 4-6 4-6 0',gut:'M8 3v5a3 3 0 0 0 6 0V5a3 3 0 0 1 6 0v11a5 5 0 0 1-10 0v-2a3 3 0 0 0-6 0v7',band:'M4 16 16 4a4 4 0 0 1 5 5L9 21a4 4 0 0 1-5-5Zm5-5 5 5m-3-7 5 5',bone:'M8 8 16 16M8 8C3 10 1 4 5 4c0-5 7-3 5 2l8 8c5-2 7 5 2 5 0 4-6 2-4-3',shield:'M12 3 3 6v6c0 5 9 9 9 9s9-4 9-9V6Zm0 5v8m-4-4h8',eye:'M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12Zm10-3a3 3 0 1 0 0 6 3 3 0 0 0 0-6',more:'M4 6h16M4 12h16M4 18h16',home:'M3 10 12 3l9 7v11h-7v-7h-4v7H3Z',phone:'M4 3h5l2 5-3 2c2 4 3 5 7 7l2-3 5 2v5C11 23 1 13 4 3Z',play:'M5 3v18l15-9Z',file:'M5 3h10l4 4v14H5Zm9 0v5h5M8 12h8M8 16h8',warn:'M12 3 2 21h20Zm0 6v5m0 3v1',truck:'M2 5h12v13H2Zm12 5h5l3 4v4h-8M6 18v3m12-3v3',list:'M8 5h13M8 12h13M8 19h13M3 5h1M3 12h1M3 19h1'};const icon=k=>`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="${paths[k]||paths.file}"/></svg>`;const groups=[['Bacteriemias y sepsis','drop'],['Infecciones respiratorias','wind'],['Infecciones urinarias','flask'],['Infecciones del SNC','brain'],['Infecciones gastrointestinales','gut'],['Piel y tejidos blandos','band'],['Infecciones osteoarticulares','bone'],['Infecciones genitales','shield'],['Infecciones oculares','eye'],['Otras infecciones','more']];const app=document.querySelector('#app');const notice='<div class="notice"><b>Demo v0.2 · No utilizar como protocolo asistencial validado.</b> Documentos originales pendientes de revisión clínica e institucional.</div>';const back=(to,label='Volver')=>`<button class="back" onclick="go('${to}')">← ${label}</button>`;const item=(id,k,title,desc,red=false)=>`<button class="item ${red?'danger':''}" onclick="go('${id}')"><span class="ico">${icon(k)}</span><span><strong>${title}</strong><small>${desc}</small></span><span aria-hidden="true">›</span></button>`;let view='home';function go(id){if(location.hash.slice(1)===id){render();return}location.hash=id}function render(){let id=location.hash.slice(1)||'home';view=id;let html='';if(id==='home'){html=notice+'<input id="search" type="search" placeholder="Buscar síndrome o muestra…" aria-label="Buscar síndrome o muestra"><h2>Síndromes infecciosos</h2><div class="grid" id="tiles">'+groups.map((g,i)=>`<button class="tile" data-search="${g[0]} ${i===0?'hemocultivos adultos pediatría sangre':''}" onclick="go('${i===0?'bacteriemias':'pending-'+i}')"><span class="ico">${icon(g[1])}</span><strong>${g[0]}</strong><span class="muted">${i===0?'Hemocultivos · Disponible':'En desarrollo'}</span></button>`).join('')+'</div><p id="empty" hidden>No se encontraron resultados.</p>'}else if(id==='samples'||id==='bacteriemias'){html=back('home','Inicio')+`<h2>${id==='samples'?'Índice de muestras':'Bacteriemias y sepsis'}</h2>`+item('hemo','drop','Hemocultivos','Adultos y pediatría')}else if(id==='hemo'){html=back('bacteriemias','Bacteriemias y sepsis')+'<h2>Hemocultivos</h2>'+notice+item('video','play','Vídeo del procedimiento','Vídeo del procedimiento · 1 min 12 s')+item('adultos','file','Hemocultivos en adultos','Esquema original paso a paso')+item('pediatria','file','Hemocultivos pediátricos','Esquema original paso a paso')+item('material','list','Material necesario','Pendiente de incorporar')+item('no-hacer','warn','QUÉ NO HACER','Errores preanalíticos',true)+item('transport','truck','Transporte y conservación','Información original parcial')+item('contacts','phone','Contactos de Microbiología','Pendiente de incorporar')}else if(['adultos','pediatria','no-hacer'].includes(id)){let titles={'adultos':'Hemocultivos en adultos','pediatria':'Hemocultivos pediátricos','no-hacer':'QUÉ NO HACER'};html=back('hemo','Hemocultivos')+`<h2>${titles[id]}</h2>`+notice+(id==='adultos'?'<p class="notice">Revisar el volumen de extracción indicado en el documento original antes de su aprobación.</p>':'')+`<p class="muted">Documento original aportado · ampliar mediante el PDF.</p><a href="media/${id}.pdf" target="_blank" rel="noopener"><img class="poster" src="media/${id}.png" alt="${titles[id]}: documento original"></a><a class="action" href="media/${id}.pdf" target="_blank" rel="noopener">Abrir PDF original ↗</a>`}else if(id==='video'){html=back('hemo','Hemocultivos')+'<h2>Vídeo del procedimiento</h2><div class="notice">Vídeo de demostración. Su contenido clínico está pendiente de validación institucional.</div><p><video controls playsinline preload="metadata" src="media/video.mp4"></video></p><p class="muted">Vídeo aportado; población y técnica pendientes de confirmar.</p>'}else if(id==='transport'){html=back('hemo','Hemocultivos')+'<h2>Transporte y conservación</h2>'+notice+'<div class="panel"><h3>Según el documento de adultos aportado</h3><p>Enviar a Microbiología inmediatamente: tubo neumático nº 103 o 538.</p><p class="muted">Confirmar vigencia de los números, autorización de transporte neumático y condiciones de conservación antes de publicar.</p></div>'+item('adultos','file','Consultar documento original','Hemocultivos en adultos')}else if(id==='contacts'){html=back('home','Inicio')+'<h2>Contactos de Microbiología</h2><div class="panel"><p>Teléfonos, horarios y responsables pendientes de facilitar y autorizar para su publicación.</p><p class="muted">No se han añadido números ficticios.</p></div>'}else if(id==='material'){html=back('hemo','Hemocultivos')+'<h2>Material necesario</h2><div class="panel"><p>Listado de material pendiente de incorporar y validar.</p></div>'}else if(id.startsWith('pending-')&&groups[Number(id.split('-')[1])]){html=back('home','Inicio')+`<h2>${groups[Number(id.split('-')[1])][0]}</h2><div class="panel">Sección en desarrollo. Todavía no hay procedimientos disponibles.</div>`}else{go('home');return}app.innerHTML=html+'<div class="footer">MICROGUÍA · Prototipo v0.2<br>Servicio de Microbiología · Hospital Universitario La Paz<br>Uso de demostración</div>';const search=document.querySelector('#search');if(search)search.addEventListener('input',()=>{let normal=s=>s.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();let n=0;document.querySelectorAll('.tile').forEach(t=>{let show=normal(t.dataset.search).includes(normal(search.value.trim()));t.hidden=!show;t.style.display=show?'':'none';if(show)n++});document.querySelector('#empty').hidden=n!==0});window.scrollTo(0,0)}document.querySelector('#navhome').innerHTML=icon('home')+'Inicio';document.querySelector('#navsamples').innerHTML=icon('list')+'Muestras';document.querySelector('#navcontacts').innerHTML=icon('phone')+'Contactos';window.addEventListener('hashchange',render);render();if('serviceWorker'in navigator&&location.protocol!=='file:')navigator.serviceWorker.register('./sw.js').catch(console.warn);
</script></body></html>

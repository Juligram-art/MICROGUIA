>${title}</strong><small>${desc}</small></span><span aria-hidden="true">›</span></button>`;let view='home';function go(id){if(location.hash.slice(1)===id){render();return}location.hash=id}function render(){let id=location.hash.slice(1)||'home';view=id;document.body.dataset.context=(id==='contacts'||id==='samples')?'neutral':(id==='no-hacer'?'warning':'bacteriemias');let html='';if(id==='home'){html=notice+'<input id="search" type="search" placeholder="Buscar síndrome o muestra…" aria-label="Buscar síndrome o muestra"><h2>Síndromes infecciosos</h2><div class="grid" id="tiles">'+groups.map((g,i)=>`<button class="tile" data-search="${g[0]} ${i===0?'hemocultivos adultos pediatría sangre':''}" onclick="go('${i===0?'bacteriemias':'pending-'+i}')"><span class="ico"><img src="assets/sindrome-${i+1}.png" alt="" loading="lazy"></span><strong>${g[0]}</strong><span class="muted">${i===0?'Hemocultivos · Disponible':'En desarrollo'}</span></button>`).join('')+'</div><p id="empty" hidden>No se encontraron resultados.</p>'}else if(id==='samples'||id==='bacteriemias'){html=back('home','Inicio')+`<h2>${id==='samples'?'Índice de muestras':'Bacteriemias y sepsis'}</h2>`+item('hemo','drop','Hemocultivos','Adultos y pediatría')}else if(id==='hemo'){html=back('bacteriemias','Bacteriemias y sepsis')+'<h2>Hemocultivos</h2>'+notice+item('video','play','Vídeo del procedimiento','Vídeo del procedimiento · 1 min 12 s')+item('adultos','file','Hemocultivos en adultos','Esquema original paso a paso')+item('pediatria','file','Hemocultivos pediátricos','Esquema original paso a paso')+item('material','list','Material necesario','Pendiente de incorporar')+item('no-hacer','warn','QUÉ NO HACER','Errores preanalíticos',true)+item('transport','truck','Transporte y conservación','Información original parcial')+item('contacts','phone','Contactos de Microbiología','Pendiente de incorporar')}else if(['adultos','pediatria','no-hacer'].includes(id)){let titles={'adultos':'Hemocultivos en adultos','pediatria':'Hemocultivos pediátricos','no-hacer':'QUÉ NO HACER'};html=back('hemo','Hemocultivos')+`<h2>${titles[id]}</h2>`+notice+(id==='adultos'?'<p class="notice">Revisar el volumen de extracción indicado en el documento original antes de su aprobación.</p>':'')+`<p class="muted">Documento original aportado · ampliar mediante el PDF.</p><a href="media/${id}.pdf" target="_blank" rel="noopener"><img class="poster" src="media/${id}.png" alt="${titles[id]}: documento original"></a><a class="action" href="media/${id}.pdf" target="_blank" rel="noopener">Abrir PDF original ↗</a>`}else if(id==='video'){html=back('hemo','Hemocultivos')+'<h2>Vídeo del procedimiento</h2><div class="notice">Vídeo de demostración. Su contenido clínico está pendiente de validación institucional.</div><p><video controls playsinline preload="metadata" src="media/video.mp4"></video></p><p class="muted">Vídeo aportado; población y técnica pendientes de confirmar.</p>'}else if(id==='transport'){html=back('hemo','Hemocultivos')+'<h2>Transporte y conservación</h2>'+notice+'<div class="panel"><h3>Según el documento de adultos aportado</h3><p>Enviar a Microbiología inmediatamente: tubo neumático nº 103 o 538.</p><p class="muted">Confirmar vigencia de los números, autorización de transporte neumático y condiciones de conservación antes de publicar.</p></div>'+item('adultos','file','Consultar documento original','Hemocultivos en adultos')}else if(id==='contacts'){html=back('home','Inicio')+'<h2>Contactos de Microbiología</h2><div class="panel"><p>Teléfonos, horarios y responsables pendientes de facilitar y autorizar para su publicación.</p><p class="muted">No se han añadido números ficticios.</p></div>'}else if(id==='material'){html=back('hemo','Hemocultivos')+'<h2>Material necesario</h2><div class="panel"><p>Listado de material pendiente de incorporar y validar.</p></div>'}else if(id.startsWith('pending-')&&groups[Number(id.split('-')[1])]){html=back('home','Inicio')+`<h2>${groups[Number(id.split('-')[1])][0]}</h2><div class="panel">Sección en desarrollo. Todavía no hay procedimientos disponibles.</div>`}else{go('home');return}app.innerHTML=html+'<div class="footer">MICROGUÍA · Prototipo v0.4<br>Servicio de Microbiología · Hospital Universitario La Paz<br>Uso de demostración</div>';const search=document.querySelector('#search');if(search)search.addEventListener('input',()=>{let normal=s=>s.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();let n=0;document.querySelectorAll('.tile').forEach(t=>{let show=normal(t.dataset.search).includes(normal(search.value.trim()));t.hidden=!show;t.style.display=show?'':'none';if(show)n++});document.querySelector('#empty').hidden=n!==0});window.scrollTo(0,0)}document.querySelector('#navhome').innerHTML=icon('home')+'Inicio';document.querySelector('#navsamples').innerHTML=icon('list')+'Muestras';document.querySelector('#navcontacts').innerHTML=icon('phone')+'Contactos';window.addEventListener('hashchange',render);render();if('serviceWorker'in navigator&&location.protocol!=='file:')navigator.serviceWorker.register('./sw.js').catch(console.warn);
